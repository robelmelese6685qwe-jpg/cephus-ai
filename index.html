<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Home Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
    }

    header h1 {
      color: #38bdf8;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 85vh;
      padding: 20px;
    }

    .hero h2 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      max-width: 700px;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .btn {
      background: #38bdf8;
      color: #0f172a;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0ea5e9;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.9);
      color: #94a3b8;
    }

    @media (max-width: 768px) {
      .hero h2 {
        font-size: 35px;
      }

      .hero p {
        font-size: 18px;
      }

      header {
        flex-direction: column;
      }

      nav {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>AI Project</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="ai.html">Go to AI</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to cephus.ai</h2>
    <p>
       is a simple AI school project website where users can ask questions
      and get instant responses from a demo AI assistant.
    </p>
    <a href="ai.html" class="btn">Go to AI</a>
  </section>

  <footer>
    <p>© 2026 AI Website | School Project</p>
  </footer>

</body>
</html>
