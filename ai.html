    function askAI() {
      const input = document.getElementById("userInput").value.trim().toLowerCase();
      const responseBox = document.getElementById("responseBox");

      if (input === "") {
        responseBox.innerHTML = "Please type a question first.";
        return;
      }

      responseBox.innerHTML = "Thinking...";

      setTimeout(() => {
        let found = false;

        for (let key in responses) {
          if (input.includes(key)) {
            responseBox.innerHTML = responses[key];
            found = true;
            break;
          }
        }

        if (!found) {
          responseBox.innerHTML = "I don't understand that yet but I am learning";
        }
      }, 800);
    }
